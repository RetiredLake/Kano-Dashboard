<div ng-if="nextModal" class="modal-overlay flexcenter-top"><div class="modal-inner modal-next-challenge center"><div ng-style="{ &quot;background-image&quot;: &quot;url(&quot; + _config.UI_ROOT + &quot;assets/challenges/images/&quot; + next.cover +&quot;)&quot; }" class="cover"></div><button ng-click="closeNextModal()" class="close"><i class="icon-cross"></i></button><div class="detail"><div class="title">${{ partial.next_up }}$<span>{{ next.title }}</span><a ng-href="#/challenges/{{selectedWorld.id}}" ng-if="next.locked" class="button button-success">{{ selectedWorld ? ${{ partial.back_to_world }}$ : '${{ challenge.menu }}$' }}</a><a ng-href="#/challenge/{{selectedWorld.id}}/{{next.id}}" ng-if="!next.locked" class="button button-success">${{ challenge.start }}$</a></div><p class="description">{{ next.description }}</p><p ng-if="next.locked" class="description small">${{ partial.come_back_tomorrow_to_continue }}$</p></div></div></div>
