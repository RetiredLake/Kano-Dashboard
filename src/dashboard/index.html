<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#58add4">
    <title>Kano Dashboard</title>
    <link rel="stylesheet" href="/dashboard.css">
  </head>
  <body>
    <main class="launcher" aria-label="Kano dashboard">
      <section class="desktop" aria-label="Dashboard from the supplied Kano reference">
        <img class="reference" src="/assets/dashboard-reference.png" alt="Kano launcher screen for Martin, Level 1. It shows Story Mode, Kano Code, Make Art, Projects, Hack Minecraft, Scratch, Make Pong, Make Snake, Terminal Quest, Song Maker, Kano World sign in, and launcher controls.">
        <a class="hotspot story" data-route="story" href="/story/" aria-label="Open Story Mode"></a>
        <a class="hotspot code" data-route="code" href="/code/" aria-label="Open Kano Code"></a>
        <a class="hotspot art" data-route="art" href="/art/" aria-label="Open Make Art"></a>
        <a class="hotspot signup" href="https://art.auth.kano.me/index.html?env=production#signup" target="_blank" rel="noopener noreferrer" aria-label="Sign up for Kano World"></a>
        <a class="hotspot login" href="https://art.auth.kano.me/index.html?env=production#login" target="_blank" rel="noopener noreferrer" aria-label="Log in to Kano World"></a>

        <button class="hotspot unavailable projects" type="button" data-message="Projects is shown in the reference screen but is not included in this web release." aria-label="Projects, unavailable in this web release"></button>
        <button class="hotspot unavailable minecraft" type="button" data-message="Hack Minecraft is shown in the reference screen but is not included in this web release." aria-label="Hack Minecraft, unavailable in this web release"></button>
        <button class="hotspot unavailable scratch" type="button" data-message="Scratch is shown in the reference screen but is not included in this web release." aria-label="Scratch, unavailable in this web release"></button>
        <button class="hotspot unavailable pong" type="button" data-message="Make Pong is shown in the reference screen but is not included in this web release." aria-label="Make Pong, unavailable in this web release"></button>
        <button class="hotspot unavailable snake" type="button" data-message="Make Snake is shown in the reference screen but is not included in this web release." aria-label="Make Snake, unavailable in this web release"></button>
        <button class="hotspot unavailable terminal" type="button" data-message="Terminal Quest is shown in the reference screen but is not included in this web release." aria-label="Terminal Quest, unavailable in this web release"></button>
        <button class="hotspot unavailable song" type="button" data-message="Song Maker is shown in the reference screen but is not included in this web release." aria-label="Song Maker, unavailable in this web release"></button>

        <button class="hotspot notification" type="button" data-message="There are no new notifications." aria-label="Notifications"></button>
        <button class="hotspot power" type="button" data-message="A browser cannot shut down or restart the device." aria-label="Power options"></button>
        <button class="hotspot classic" type="button" data-message="Classic Mode is available only on a Kano computer." aria-label="Classic Mode"></button>
        <button class="hotspot pages" type="button" data-message="Only the first launcher page is included from the supplied reference." aria-label="Launcher pages"></button>
        <button class="hotspot settings" type="button" data-message="Device settings are controlled by the operating system and are not available from a browser." aria-label="Settings"></button>
        <button class="hotspot sound" type="button" data-message="Volume is controlled by your device." aria-label="Volume"></button>
        <button class="hotspot network" type="button" data-message="Network settings are controlled by your device." aria-label="Network"></button>
      </section>

      <section class="mobile" aria-label="Kano apps">
        <header class="mobile-profile">
          <span class="avatar" aria-hidden="true">m</span>
          <span><strong>martin</strong><small>Level 1</small></span>
        </header>
        <a class="mobile-feature" data-route="story" href="/story/">
          <span class="mobile-icon story-icon" aria-hidden="true">▶</span>
          <span><strong>Story Mode</strong><small>Continue the adventure</small></span>
          <span class="chevron" aria-hidden="true">›</span>
        </a>
        <h1>Apps</h1>
        <div class="mobile-grid">
          <a class="mobile-app" data-route="code" href="/code/"><span class="mobile-icon code-icon" aria-hidden="true">K</span><span>Kano Code</span></a>
          <a class="mobile-app" data-route="art" href="/art/"><span class="mobile-icon art-icon" aria-hidden="true">✦</span><span>Make Art</span></a>
          <span class="mobile-app unavailable-mobile"><span class="mobile-icon project-icon" aria-hidden="true">▦</span><span>Projects</span></span>
          <span class="mobile-app unavailable-mobile"><span class="mobile-icon minecraft-icon" aria-hidden="true">⬢</span><span>Hack Minecraft</span></span>
          <span class="mobile-app unavailable-mobile"><span class="mobile-icon scratch-icon" aria-hidden="true">◉</span><span>Scratch</span></span>
          <span class="mobile-app unavailable-mobile"><span class="mobile-icon pong-icon" aria-hidden="true">●</span><span>Make Pong</span></span>
          <span class="mobile-app unavailable-mobile"><span class="mobile-icon snake-icon" aria-hidden="true">↪</span><span>Make Snake</span></span>
          <span class="mobile-app unavailable-mobile"><span class="mobile-icon terminal-icon" aria-hidden="true">›_</span><span>Terminal Quest</span></span>
          <span class="mobile-app unavailable-mobile"><span class="mobile-icon song-icon" aria-hidden="true">▥</span><span>Song Maker</span></span>
        </div>
        <footer class="mobile-world">
          <a href="https://art.auth.kano.me/index.html?env=production#signup" target="_blank" rel="noopener noreferrer">Join Kano World</a>
          <a href="https://art.auth.kano.me/index.html?env=production#login" target="_blank" rel="noopener noreferrer">Log in</a>
        </footer>
      </section>
    </main>
    <p id="status" class="status" role="status" aria-live="polite"></p>
    <script src="/dashboard.js" defer></script>
  </body>
</html>
