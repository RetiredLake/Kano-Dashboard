<header><div class="main-navigation page-width"><a href="/" class="logo"><img ng-src="{{ _config.UI_ROOT + &quot;assets/layout/header-logo.svg&quot; }}" alt="main logo"/></a><ul class="nav nav-left"><li><a href="/challenges" ng-class="{ active: basePath === &quot;challenge&quot; || basePath === &quot;challenges&quot; }"><div ng-bind-html="icons.challenges | trust" class="big icon"></div>${{ challenges.challenges }}$</a></li><li><a href="/playground" ng-class="{ active: basePath === &quot;playground&quot; }"><div ng-bind-html="icons.create | trust" class="icon"></div>${{ challenges.playground }}$</a></li><li><a href="https://world.kano.me" target="_blank"><div ng-bind-html="icons.world | trust" class="big icon"></div>${{ challenges.kano_world }}$</a></li></ul><ul ng-cloak="ng-cloak" class="nav nav-right"><li ng-if="!offline &amp;&amp; !loggedIn"><a href="" ng-click="auth.openModal(&quot;login&quot;)"><i class="icon-login"></i>${{ partial.login }}$</a></li><li ng-if="!offline &amp;&amp; !loggedIn"><a href="" ng-click="auth.openModal(&quot;signup&quot;)" class="signup">${{ partial.signup }}$</a></li><li ng-if="!offline &amp;&amp; loggedIn"><a ng-href="http://world.kano.me/profile/creations" target="_blank" class="user-display"><div class="avatar"><img ng-src="{{ user.avatar }}"/></div>{{ user.username }}</a></li><li ng-if="!offline &amp;&amp; loggedIn"><a href="" ng-click="logout()"><i class="icon-logout"></i>${{ partial.logout }}$</a></li><li><button ng-click="shutdown()" ng-if="offline" class="close"><i class="icon-cross"></i></button></li></ul></div></header>
