<div ng-if="nextModal" class="modal-overlay flexcenter-top"><div class="modal-inner modal-next-challenge center"><div ng-style="{ &quot;background-image&quot;: &quot;url(&quot; + _config.UI_ROOT + &quot;assets/challenges/images/&quot; + next.cover +&quot;)&quot; }" class="cover"></div><button ng-click="closeNextModal()" class="close"><i class="icon-cross"></i></button><div class="detail"><div class="title">Next up:<span>{{ next.title }}</span><a ng-href="#/challenges/{{selectedWorld.id}}" ng-if="next.locked" class="button button-success">{{ selectedWorld ? 'Back to ' + selectedWorld.name : 'Menu' }}</a><a ng-href="#/challenge/{{selectedWorld.id}}/{{next.id}}" ng-if="!next.locked" class="button button-success">Start</a></div><p class="description">{{ next.description }}</p><p ng-if="next.locked" class="description small">Come back tomorrow to continue this challenge</p></div></div></div>
